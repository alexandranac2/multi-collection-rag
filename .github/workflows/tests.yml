name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # "true"/"false" only; the key itself is exposed to the eval step alone
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Docling pulls in torch; CPU wheels keep the install small
      - run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # Real-embedding eval runs only when the repo has an OPENAI_API_KEY secret
      - name: retrieval eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        if: env.HAS_OPENAI_KEY == 'true'
        run: python -m evals.retrieval_eval
